version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: eaiselp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eaiselp
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./eaiselp-data/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.3.0-slim
    container_name: eaiselp-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports: ["8848:8848", "9848:9848"]

  minio:
    image: minio/minio:latest
    container_name: eaiselp-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: eaiselp
      MINIO_ROOT_PASSWORD: eaiselp123
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio_data:/data

  # M3-1 监控告警：Prometheus 抓取 runtime:8081 / auth:8085 的 /actuator/prometheus 端点
  # 注意：本机 Spring Boot 服务运行在宿主机（非 docker compose 网络内），故 targets 用 host.docker.internal
  prometheus:
    image: prom/prometheus:latest
    container_name: eaiselp-prometheus
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # M3-1 监控告警：Grafana 可视化面板，默认 admin/admin，数据源指向同网络 prometheus:9090
  grafana:
    image: grafana/grafana:latest
    container_name: eaiselp-grafana
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  mysql_data:
  minio_data:
  grafana_data:
