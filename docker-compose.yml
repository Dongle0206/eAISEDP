version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: eaiselp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eaiselp
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./eaiselp-data/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.3.0-slim
    container_name: eaiselp-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports: ["8848:8848", "9848:9848"]

  minio:
    image: minio/minio:latest
    container_name: eaiselp-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: eaiselp
      MINIO_ROOT_PASSWORD: eaiselp123
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  minio_data:
