server:
  port: 8081
  tomcat:                                                       # M2-DFX 异步化后 Tomcat 线程不再被 LLM 阻塞，200 线程足以扛轮询（SE §4.3.1）
    threads:
      max: 200                                                  # 工作线程上限
      min-spare: 20                                             # 预热保活
    accept-count: 100                                           # 满载时排队连接数
    max-connections: 8192                                       # TCP 连接上限
    connection-timeout: 10s                                     # 连接建立超时（非请求处理超时）
spring:
  application:
    name: eaiselp-runtime
  mvc:
    servlet:
      load-on-startup: 1
  datasource:                                                   # M1.2 新增：data 模块需要
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/eaiselp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:                                                       # #22 数据库版本管理：schema 变更自动迁移（幂等）
    enabled: true
    baseline-on-migrate: true                                   # 已有库自动 baseline（跳过 V1，防清库）
    baseline-version: 1
    locations: classpath:db/migration
  sql:                                                          # 关闭 spring.sql.init（由 Flyway 接管建表）
    init:
      mode: never
    hikari:                                                     # M2-DFX 连接池调优（SE §4.4.1）：异步化后并发 DB 写入 = runtime-llm 池 max(20) + Tomcat 读，20 连接足够
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000                                 # 拿连接等 30s
      idle-timeout: 600000                                      # 空闲 10min 回收
      max-lifetime: 1800000                                     # 连接最长 30min（防 MySQL wait_timeout 踢）
      leak-detection-threshold: 60000                           # 60s 未归还告警（定位泄漏）
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
mybatis-plus:                                                    # M1.2 新增：从原 data/application.yml 迁移
  configuration:
    map-underscore-to-camel-case: true                          # 驼峰自动映射（case_id → caseId）
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
eaiselp:
  workspace:                                                                   # 产出落地链路：AI 产出 → 文件系统 → Git
    root: ${WORKSPACE_ROOT:./workspaces}                                       # 工作区根目录（每个 Case 一个子目录）
  git:                                                                         # Git 落地（编排完成后自动 commit + push）
    remote-url: ${GIT_REMOTE_URL:}                                             # 远程仓库 URL（空则只 commit 不 push）
    token: ${GIT_TOKEN:}                                                       # 访问 token（Personal Access Token）
    author-name: eAISEDP-Bot
    author-email: bot@eaiselp.com
  cicd:                                                                         # CI/CD 触发（灵活适配 Jenkins/GitLab/GitHub/Gitea/Drone 等通过 Webhook）
    webhook-url: ${CICD_WEBHOOK_URL:}                                           # CI/CD 工具的 Webhook 接收地址（空=不触发，Git push 后 CI/CD 可自动感知）
    webhook-token: ${CICD_WEBHOOK_TOKEN:}                                       # Webhook 认证 token（Bearer + 自定义 Header 双发，兼容各工具）
    timeout-ms: 10000                                                           # 触发请求超时
  orchestration:                                                               # 编排模式配置
    step-interval-ms: 3000                                                     # 步骤间间隔（防 LLM 429 限流）
  notify:                                                                      # #28 通知渠道（钉钉群机器人，未配置则跳过）
    dingtalk-webhook: ${DINGTALK_WEBHOOK:}                                     # 钉钉群 → 群设置 → 智能群助手 → 自定义机器人
  artifact:                                                                    # SP-4：产物类型映射（清除 P6 硬编码，新增角色只改 yml 不动 Java）
    default-type: other                                                        # 未匹配时的兜底类型
    type-mapping:                                                              # 角色名(agent.name) → 产物类型
      team-po: prd
      team-ux: design
      team-se: tech-design
      team-ba: tasks
      team-dev: code
      team-reviewer: review
      team-security: review
      team-qa: test
      team-performance: perf
      team-ops: deploy
      team-pm: tracking
  system:
    path: ${SYSTEM_PATH:../agents-config}
  web:                                                                        # M2 前后端分离：runtime 托管前端静态文件（消除跨域）
    root: ${WEB_ROOT:D:/eaiselp/web}                                          # 指向前端 clone 目录，空则不托管
  security:                                                                   # M2 Phase 1 新增：JWT 校验配置（必须与 auth:8085 同密钥，否则 token 校验失败）
    jwt:
      secret: ${JWT_SECRET:dev-placeholder-secret-must-be-at-least-32-bytes-long-for-hs256-algorithm}
      expire-seconds: 86400
      issuer: eaiselp-auth
    force-https: false
  adapter:                                                                    # M2 SP-6 多 provider 路由（P8 解耦层）：档位→具体模型映射由 t_model_routing 表权威，不在 yml 内联
    llm:
      glm:                                                                     # GLM（智谱）始终装配（GlmLlmAdapter @Component）
        api-key: ${GLM_API_KEY:}                                               # 严禁明文，走环境变量 GLM_API_KEY（SE §2.4 安全约束）
        base-url: ${GLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}         # 智谱 v4 端点根（SE §9.3）
      deepseek:                                                                # DeepSeek 预留（OpenAI 兼容），配 Key + enabled=true 后由条件装配启用
        enabled: ${DEEPSEEK_ENABLED:false}                                     # 默认关闭；启用后 DeepSeekLlmAdapter 装配，路由表 deepseek 行生效
        api-key: ${DEEPSEEK_API_KEY:}
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
      mcp:                                                                     # M4-2 MCP 集成深化：HttpMCPAdapter 通过 HTTP+JSON-RPC 2.0 对接外部 MCP Server
        enabled: ${MCP_ENABLED:false}                                          # 默认关闭；启用后 HttpMCPAdapter/StubMCPAdapter 装配，按 server-url 非空判定可用
        server-url: ${MCP_SERVER_URL:http://localhost:3001/mcp}                # MCP Server JSON-RPC 端点（空字符串则 isAvailable=false 走降级）
  async:                                                                       # M2-DFX LLM 异步线程池（SE §4.3.2 / §7），外置便于调参不重打包
    llm:
      core: 5                                                                  # core 设低防突发烧光配额；与 LLM provider QPS 限额挂钩（SE §10 D-2）
      max: 20                                                                  # 突发上限
      queue: 50                                                                # 缓冲队列（core+queue+max 最多 70 任务）
  ratelimit:                                                                   # M2-DFX 限流（SE §4.2.6 / §7）
    bucket-ttl-minutes: 30                                                     # 桶 30 分钟未访问清理
    bucket-max-size: 100000                                                    # 桶硬上限（防 OOM，超限告警，M3 换 Redis）
  task:                                                                        # M2-DFX 派生任务内存态治理（SE §5.2 / §11）
    memory-ttl-minutes: 60                                                     # 已完成任务内存态 60 分钟后清理
management:                                                                    # M3-1 监控告警：Actuator 端点 + Prometheus 指标暴露
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus                               # 只暴露必需端点，info/env/loggers 等敏感端点关闭
  endpoint:
    health:                                                                    # health 端点详情：仅授权用户可见（防止未授权探测 DB/Nacos/磁盘连通性）
      show-details: when_authorized
  metrics:                                                                     # 所有指标统一打 application 标签，便于 Grafana 跨实例聚合
    tags:
      application: eaiselp-runtime
