spring:
  datasource:
    url: jdbc:h2:mem:eaiselp;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # QA 20260818 修复（存量测试基建缺口，非本 case 引入）：主 application.yml 的 Flyway 在 test
  # profile 必须显式关闭——迁移脚本为 MySQL 专有语法（CREATE DATABASE/反引号），H2（MODE=MySQL）
  # 无法执行，FlywayAutoConfiguration 抢跑 V1 会导致 @SpringBootTest 上下文启动失败；
  # H2 建表继续由下方 schema-h2.sql（spring.sql.init）承担。
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  # 关闭 nacos 注册（测试无 nacos 实例，避免启动卡住或失败）
  cloud:
    nacos:
      discovery:
        enabled: false
        register-enabled: false
    discovery:
      enabled: false
  # 关闭 CapabilityLoader 的 @Scheduled 热重载（避免测试期间触发文件扫描）
  autoconfigure:
    exclude:
      - org.springframework.cloud.alibaba.nacos.discovery.NacosDiscoveryAutoConfiguration
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
eaiselp:
  tenant:
    mode: shared
  artifact:                                  # SP-4 产物类型映射（与生产 application.yml 对齐）
    default-type: other
    type-mapping:
      team-po: prd
      team-ux: design
      team-se: tech-design
      team-ba: tasks
      team-dev: code
      team-reviewer: review
      team-security: review
      team-qa: test
      team-performance: perf
      team-ops: deploy
      team-pm: tracking
  system:
    path: ./nonexistent-agents-config-test   # 测试不依赖体系文件加载
    auto-refresh: false
