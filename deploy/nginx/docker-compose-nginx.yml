version: '3.8'
services:
  nginx:
    image: nginx:alpine
    container_name: eaiselp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - D:/eaiselp/web:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on: []
    networks:
      - eaiselp-net

networks:
  eaiselp-net:
    external: true
    name: eaiselp-net
