worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # auth 服务负载均衡（2 实例轮询）
    upstream auth_backend {
        server host.docker.internal:8085 weight=1 max_fails=3 fail_timeout=30s;
        server host.docker.internal:8086 weight=1 max_fails=3 fail_timeout=30s;
    }

    # runtime 服务负载均衡（2 实例轮询）
    upstream runtime_backend {
        server host.docker.internal:8081 weight=1 max_fails=3 fail_timeout=30s;
        server host.docker.internal:8082 weight=1 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name localhost;

        # 前端静态文件
        location / {
            root /usr/share/nginx/html;
            index login.html;
            try_files $uri $uri/ /login.html;
        }

        # auth 服务（登录/当前用户/退出）
        location /api/v1/auth/ {
            proxy_pass http://auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_next_upstream error timeout http_502 http_503;
        }

        # runtime 业务 API
        location /api/ {
            proxy_pass http://runtime_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_next_upstream error timeout http_502 http_503;
        }

        # Actuator 健康检查（Nginx 主动探测用）
        location /actuator/health {
            proxy_pass http://runtime_backend;
            access_log off;
        }
    }
}
